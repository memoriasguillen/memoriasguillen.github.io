<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bo Bragason Fan Site - Arquivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background: #121212; color: #fff; min-height: 100vh; }
        .sidebar { width: 250px; background: #1e1e1e; padding: 20px; position: fixed; height: 100vh; border-right: 1px solid #333; }
        .sidebar h2 { color: #ff4757; margin-bottom: 30px; text-align: center; font-size: 24px; }
        .sidebar a { display: block; color: #bbb; padding: 12px; text-decoration: none; border-radius: 5px; margin-bottom: 10px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: #ff4757; color: #fff; }
        .content { margin-left: 250px; padding: 40px; width: calc(100% - 250px); }
        .section-title { font-size: 28px; margin-bottom: 20px; color: #ff4757; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        /* Archive Layout */
        .archive-year { font-size: 22px; color: #ff4757; margin: 25px 0 10px 0; font-weight: bold; }
        .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
        .archive-item { position: relative; aspect-ratio: 1/1; background: #222; border-radius: 3px; overflow: hidden; border: 1px solid #333; }
        .archive-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(40%); transition: all 0.25s ease; }
        .archive-item:hover img { filter: grayscale(0%); transform: scale(1.1); }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .content { margin-left: 0; width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>Bo Bragason</h2>
        <a href="index.html">Início</a>
        <a href="about.html">Sobre</a>
        <a href="filmography.html">Filmografia</a>
        <a href="gallery.html">Galeria</a>
        <a href="archive.html" class="active">Arquivo</a>
    </nav>
    <main class="content">
        <h2 class="section-title">Arquivo de Posts</h2>

        <div class="archive-year">2026</div>
        <div class="archive-grid">
            <div class="archive-item"><img src="https://via.placeholder.com/150?text=1" alt="Post"></div>
            <div class="archive-item"><img src="https://via.placeholder.com/150?text=2" alt="Post"></div>
            <div class="archive-item"><img src="https://via.placeholder.com/150?text=3" alt="Post"></div>
            <div class="archive-item"><img src="https://via.placeholder.com/150?text=4" alt="Post"></div>
        </div>

        <div class="archive-year">2025</div>
        <div class="archive-grid">
            <div class="archive-item"><img src="https://via.placeholder.com/150?text=5" alt="Post"></div>
            <div class="archive-item"><img src="https://via.placeholder.com/150?text=6" alt="Post"></div>
            <div class="archive-item"><img src="https://via.placeholder.com/150?text=7" alt="Post"></div>
        </div>
    </main>
</body>
</html>
