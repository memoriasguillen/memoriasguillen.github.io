<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bo Bragason Fan Site - Galeria</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background: #121212; color: #fff; min-height: 100vh; }
        .sidebar { width: 250px; background: #1e1e1e; padding: 20px; position: fixed; height: 100vh; border-right: 1px solid #333; }
        .sidebar h2 { color: #ff4757; margin-bottom: 30px; text-align: center; font-size: 24px; }
        .sidebar a { display: block; color: #bbb; padding: 12px; text-decoration: none; border-radius: 5px; margin-bottom: 10px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: #ff4757; color: #fff; }
        .content { margin-left: 250px; padding: 40px; width: calc(100% - 250px); }
        .section-title { font-size: 28px; margin-bottom: 20px; color: #ff4757; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 6px; border: 1px solid #333; cursor: pointer; aspect-ratio: 1/1; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .gallery-item:hover img { transform: scale(1.05); }

        /* Lightbox Overlay */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 1000; justify-content: center; align-items: center; }
        .lightbox-content { max-width: 85%; max-height: 85%; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .lightbox-close:hover { color: #ff4757; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .content { margin-left: 0; width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>Bo Bragason</h2>
        <a href="index.html">Início</a>
        <a href="about.html">Sobre</a>
        <a href="filmography.html">Filmografia</a>
        <a href="gallery.html" class="active">Galeria</a>
        <a href="archive.html">Arquivo</a>
    </nav>
    <main class="content">
        <h2 class="section-title">Galeria de Fotos</h2>
        <div class="gallery-grid">
            <!-- Insira os links diretos do ImgBB (i.ibb.co) abaixo -->
            <div class="gallery-item" onclick="openLightbox('https://via.placeholder.com/800x600?text=Foto+1')">
                <img src="https://via.placeholder.com/300x300?text=Foto+1" alt="Bo Bragason 1">
            </div>
            <div class="gallery-item" onclick="openLightbox('https://via.placeholder.com/800x600?text=Foto+2')">
                <img src="https://via.placeholder.com/300x300?text=Foto+2" alt="Bo Bragason 2">
            </div>
            <div class="gallery-item" onclick="openLightbox('https://via.placeholder.com/800x600?text=Foto+3')">
                <img src="https://via.placeholder.com/300x300?text=Foto+3" alt="Bo Bragason 3">
            </div>
        </div>
    </main>

    <!-- Lightbox Element -->
    <div id="lightboxOverlay" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" class="lightbox-content" src="" alt="Ampliada" onclick="event.stopPropagation()">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxOverlay').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightboxOverlay').style.display = 'none';
            document.getElementById('lightboxImg').src = '';
        }
    </script>
</body>
</html>
