<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bo Bragason Fan Site - Filmografia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background: #121212; color: #fff; min-height: 100vh; }
        .sidebar { width: 250px; background: #1e1e1e; padding: 20px; position: fixed; height: 100vh; border-right: 1px solid #333; }
        .sidebar h2 { color: #ff4757; margin-bottom: 30px; text-align: center; font-size: 24px; }
        .sidebar a { display: block; color: #bbb; padding: 12px; text-decoration: none; border-radius: 5px; margin-bottom: 10px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: #ff4757; color: #fff; }
        .content { margin-left: 250px; padding: 40px; width: calc(100% - 250px); }
        .section-title { font-size: 28px; margin-bottom: 20px; color: #ff4757; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .video-item { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 30px; }
        .video-item h3 { margin-bottom: 15px; color: #ff4757; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; background: #000; border: 1px solid #444; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .content { margin-left: 0; width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>Bo Bragason</h2>
        <a href="index.html">Início</a>
        <a href="about.html">Sobre</a>
        <a href="filmography.html" class="active">Filmografia</a>
        <a href="gallery.html">Galeria</a>
        <a href="archive.html">Arquivo</a>
    </nav>
    <main class="content">
        <h2 class="section-title">Filmografia e Episódios</h2>
        
        <div class="video-item">
            <h3>Exemplo de Episódio / Filme (Hospedagem Externa Voe/Internxt)</h3>
            <div class="video-wrapper">
                <!-- Substitua o URL abaixo pelo link de incorporação (embed) do seu player externo (ex: Voe.sx) -->
                <iframe src="https://voe.sx/e/example_id" allowfullscreen></iframe>
            </div>
        </div>
    </main>
</body>
</html>
